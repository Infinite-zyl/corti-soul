<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>corti-soul 启动器</title>
<link rel="stylesheet" href="games.css">
<style>
  :root{
    --light:#B975F9; --base:#A855F7; --accent:#EC4899;
    --bg:#0B0E14; --bg2:#0E1219;
    --panel:rgba(255,255,255,.042); --panel2:rgba(255,255,255,.065);
    --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.14);
    --ink:#EEF2F8; --dim:#B4BECD; --muted:#7E8798;
    --ok:#34D399; --bad:#F8717A; --warn:#FBBF24;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 480px at 6% -16%, color-mix(in srgb, var(--base) 24%, transparent), transparent 62%),
      radial-gradient(820px 460px at 106% -6%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
      var(--bg);
    color:var(--ink);
    font:14px/1.5 "MiSans","Microsoft YaHei UI","Microsoft YaHei","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden; user-select:none; cursor:default;
  }
  .shell{display:flex;flex-direction:column;height:100vh;transform-origin:center;transition:filter .16s ease}
  body.window-resizing .shell{filter:brightness(1.025)}
  body.resize-settled .shell{animation:resize-settle .18s cubic-bezier(.2,.7,.2,1)}
  @keyframes resize-settle{from{transform:scale(.996)}to{transform:scale(1)}}

  /* ---------- 标题栏 ---------- */
  .titlebar{
    height:46px;flex:none;display:flex;align-items:center;gap:10px;
    padding:0 11px 0 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0));
    cursor:grab;
  }
  .titlebar:active{cursor:grabbing}
  .orb{
    width:19px;height:19px;border-radius:7px;flex:none;
    background:conic-gradient(from 140deg,var(--base),var(--accent),var(--base));
    box-shadow:0 0 0 1px rgba(255,255,255,.16),0 4px 14px color-mix(in srgb,var(--base) 42%,transparent);
  }
  .titlebar b{font-size:13.5px;font-weight:650;letter-spacing:.2px}
  .titlebar .tag{
    font-size:11px;color:var(--muted);border:1px solid var(--line);
    border-radius:99px;padding:1px 9px;margin-left:2px;
  }
  .titlebar .grow{flex:1}
  .wbtn{
    width:32px;height:26px;border-radius:8px;border:1px solid transparent;
    background:transparent;color:var(--dim);font:inherit;font-size:14px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .14s,color .14s,border-color .14s;
  }
  .wbtn:hover{background:var(--panel2);color:var(--ink);border-color:var(--line)}
  .wbtn.closed:hover{background:#B3373F;border-color:#B3373F;color:#fff}

  /* ---------- 主体 ---------- */
  .body{flex:1;display:grid;grid-template-columns:264px 1fr;min-height:0}

  aside{
    border-right:1px solid var(--line);padding:20px 16px 16px;
    display:flex;flex-direction:column;gap:16px;min-height:0;
    background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 70%);
  }
  .ringwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4px}
  .ring{position:relative;width:132px;height:132px}
  .ring svg{transform:rotate(-90deg)}
  .ring .mid{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;
  }
  .ring .mid em{font-style:normal;font-size:29px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .ring .mid em small{font-size:14px;font-weight:500;color:var(--muted)}
  .ring .mid s{text-decoration:none;font-size:11px;color:var(--muted);letter-spacing:1.4px}
  .verdict{font-size:13px;font-weight:600}
  .verdict sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}

  .tactions{display:flex;flex-direction:column;gap:9px}
  .btn{
    border:1px solid var(--line2);border-radius:11px;padding:11px 14px;
    font:inherit;font-size:13.5px;font-weight:550;color:var(--ink);cursor:pointer;
    background:var(--panel);transition:filter .16s,transform .1s,border-color .16s,background .16s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:hover{filter:brightness(1.16);border-color:color-mix(in srgb,var(--base) 46%,transparent)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    border-color:transparent;color:#fff;
    background:linear-gradient(180deg,color-mix(in srgb,var(--base) 92%,transparent),color-mix(in srgb,var(--accent) 78%,transparent));
    box-shadow:0 10px 26px color-mix(in srgb,var(--base) 30%,transparent);
  }
  .btn[disabled]{opacity:.5;cursor:progress;filter:none}

  .spacer{flex:1;min-height:6px}
  .meta{font-size:11px;color:var(--muted);line-height:1.65;border-top:1px solid var(--line);padding-top:12px}
  .meta code{
    color:var(--dim);font-family:"Cascadia Mono",Consolas,monospace;font-size:10.5px;
    overflow-wrap:break-word;word-break:break-word;
  }
  .linkbtn{
    background:none;border:none;color:var(--muted);font:inherit;font-size:11.5px;
    cursor:pointer;padding:2px 0;text-align:left;transition:color .14s;
  }
  .linkbtn:hover{color:var(--dim)}
  .linkbtn.danger:hover{color:var(--bad)}

  main{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
  main::-webkit-scrollbar{width:9px}
  main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px}
  main::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}

  .sect{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}

  /* ---------- 当前模型 ---------- */
  .provider{
    border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;
    background:linear-gradient(120deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    display:flex;align-items:center;gap:14px;
  }
  .provider .lead{display:flex;flex-direction:column;gap:2px;min-width:0}
  .provider .lead span{font-size:11px;color:var(--muted);letter-spacing:.4px}
  .provider .lead b{
    font-size:14px;font-weight:600;overflow-wrap:break-word;word-break:break-word;
  }
  .provider .grow{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    font-size:11px;color:var(--dim);border:1px solid var(--line);
    border-radius:99px;padding:2px 9px;white-space:nowrap;
  }
  .chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
  .model-routing{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-top:10px}
  .model-routing label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim)}
  .model-routing select,.model-routing button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:36px}
  .model-routing select{max-width:420px;min-width:140px}
  .model-routing option{background:#201b29;color:#f6f1fc}
  .model-routing :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .model-routing :disabled{opacity:.5;cursor:not-allowed}
  .model-routing button{cursor:pointer}
  .model-routing button:hover:not(:disabled){background:var(--panel2)}
  .model-mode-note{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.5}

  /* ---------- 服务卡 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:10px}
  .svc{
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;
    background:var(--panel);display:flex;align-items:center;gap:10px;
    transition:border-color .2s,background .2s,transform .12s;
  }
  .svc:hover{background:var(--panel2);transform:translateY(-1px)}
  .svc .dot{
    width:9px;height:9px;border-radius:50%;flex:none;background:var(--bad);
    box-shadow:0 0 9px color-mix(in srgb,var(--bad) 65%,transparent);
  }
  .svc.up .dot{background:var(--ok);box-shadow:0 0 9px color-mix(in srgb,var(--ok) 65%,transparent)}
  .svc.up{border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
  .svc.paused .dot{background:var(--muted);box-shadow:none}
  .svc.pending{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:rgba(251,191,36,.055)}
  .svc.pending .dot{background:var(--warn);box-shadow:0 0 10px color-mix(in srgb,var(--warn) 65%,transparent);animation:pulse 1.1s ease-in-out infinite alternate}
  .svc.pending .st{color:var(--warn)}
  @keyframes pulse{to{opacity:.45;transform:scale(.82)}}
  .svc .txt{min-width:0;flex:1}
  .svc .txt b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .svc .txt i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .svc .st{font-size:11px;color:var(--bad);font-weight:600;flex:none}
  .svc.up:not(.pending) .st{color:var(--ok)}
  .service-action{
    flex:none;min-width:54px;border:1px solid transparent;border-radius:7px;
    padding:4px 8px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;
    transition:background .2s ease,border-color .2s ease,color .2s ease,transform .16s ease,box-shadow .2s ease;
  }
  .service-action:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.16)}
  .service-action:active:not(:disabled){transform:translateY(0) scale(.97)}
  .service-action.stop{color:#FCA5A5;background:rgba(248,113,122,.09);border-color:rgba(248,113,122,.28)}
  .service-action.stop:hover:not(:disabled){background:rgba(248,113,122,.18);border-color:var(--bad)}
  .service-action.start{color:#6EE7B7;background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.3)}
  .service-action.start:hover:not(:disabled){background:rgba(52,211,153,.18);border-color:var(--ok)}
  .service-action.pending{color:#FCD34D;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.38);cursor:progress}
  .service-action.pending::before{content:'';display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  .service-action:disabled{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 标签页 ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:-2px}
  .tabs button{
    background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
    font:inherit;font-size:13px;font-weight:550;padding:7px 13px;cursor:pointer;
    transition:color .15s,border-color .15s;
  }
  .tabs button:hover{color:var(--dim)}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--base)}
  .tabs .grow{flex:1}
  .tabs .when{font-size:11px;color:var(--muted);align-self:center;font-variant-numeric:tabular-nums}

  .stream{
    border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22);
    padding:6px 4px;max-height:210px;overflow-y:auto;
    font-family:"Cascadia Mono",Consolas,monospace;font-size:11.5px;line-height:1.75;
    user-select:text;cursor:text;
  }
  .stream::-webkit-scrollbar{width:8px}
  .stream::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
  .row{display:flex;gap:9px;padding:1px 10px;border-radius:6px}
  .row:hover{background:rgba(255,255,255,.035)}
  .row .t{color:var(--muted);flex:none}
  .row .lv{flex:none;width:38px;text-align:center;border-radius:4px;font-size:10px;color:var(--dim);background:rgba(255,255,255,.06)}
  .row.warn .lv{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
  .row.error .lv{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
  .row .m{color:var(--dim);min-width:0;overflow-wrap:break-word;word-break:break-word;white-space:pre-wrap}
  .empty{color:var(--muted);padding:14px 12px;font-size:12px;font-family:inherit}

  .hint{font-size:11px;color:var(--muted)}
  .resize-handle{position:fixed;z-index:40;touch-action:none}
  .resize-handle.n,.resize-handle.s{left:7px;right:7px;height:6px;cursor:ns-resize}
  .resize-handle.n{top:0}.resize-handle.s{bottom:0}
  .resize-handle.e,.resize-handle.w{top:7px;bottom:7px;width:6px;cursor:ew-resize}
  .resize-handle.e{right:0}.resize-handle.w{left:0}
  .resize-handle.ne,.resize-handle.nw,.resize-handle.se,.resize-handle.sw{width:12px;height:12px}
  .resize-handle.ne{top:0;right:0;cursor:nesw-resize}
  .resize-handle.nw{top:0;left:0;cursor:nwse-resize}
  .resize-handle.se{right:0;bottom:0;cursor:nwse-resize}
  .resize-handle.sw{left:0;bottom:0;cursor:nesw-resize}
  body.window-minimizing{animation:window-minimize .18s cubic-bezier(.4,0,.8,.4) forwards;pointer-events:none}
  body.window-restoring{animation:window-restore .22s cubic-bezier(.2,.7,.2,1) both}
  @keyframes window-minimize{to{opacity:0;transform:translateY(12px) scale(.965)}}
  @keyframes window-restore{from{opacity:0;transform:translateY(10px) scale(.975)}to{opacity:1;transform:translateY(0) scale(1)}}
  @media(prefers-reduced-motion:reduce){
    body.window-minimizing,body.window-restoring{animation-duration:.01ms}
    .service-action.pending::before,.svc.pending .dot{animation:none}
    body.resize-settled .shell{animation-duration:.01ms}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="titlebar">
    <div class="orb"></div>
    <b id="appname">corti-soul 启动器</b>
    <span class="tag" id="ver">v2.1.0</span>
    <span class="grow"></span>
    <button class="wbtn" id="b-min" title="最小化">–</button>
    <button class="wbtn" id="b-hide" title="收进托盘（后台继续运行）">⤓</button>
    <button class="wbtn closed" id="b-quit" title="退出并停止 SnowLuma、OneBot WS、Cortico 和免费池守护">✕</button>
  </div>

  <div class="body">
    <aside>
      <div class="ringwrap">
        <div class="ring">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle cx="66" cy="66" r="56" fill="none" stroke="rgba(255,255,255,.075)" stroke-width="9"/>
            <circle id="arc" cx="66" cy="66" r="56" fill="none" stroke="var(--base)" stroke-width="9"
                    stroke-linecap="round" stroke-dasharray="351.9" stroke-dashoffset="351.9"
                    style="transition:stroke-dashoffset .5s ease,stroke .4s"/>
          </svg>
          <div class="mid">
            <em id="cnt">–<small id="tot"></small></em>
            <s>在线</s>
          </div>
        </div>
        <div class="verdict" id="verdict">正在检查 …<sub>读取端口与进程</sub></div>
      </div>

      <div class="tactions">
        <button class="btn primary" id="b-start">启动全部</button>
        <button class="btn" id="b-refresh">刷新状态</button>
      </div>

      <div class="spacer"></div>

      <div class="meta">
        <div id="meta-run">—</div>
        <code id="meta-base"></code>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:2px">
          <button class="linkbtn" id="b-console">打开 Cortico 控制台 ↗</button>
          <button class="linkbtn" id="b-snow">打开 SnowLuma WebUI ↗</button>
          <button class="linkbtn danger" id="b-exit">退出并停止托管服务</button>
        </div>
      </div>
    </aside>

    <main>
      <div class="provider">
        <div class="lead">
          <span>当前模型</span>
          <b id="p-active">—</b>
        </div>
        <div class="grow"></div>
        <div class="chips" id="p-chips"></div>
      </div>
      <div id="model-settings">
        <div class="model-routing">
          <label>切换方式<select id="model-mode"><option value="auto">自动切换</option><option value="manual">手动固定</option></select></label>
          <label>主模型端点<select id="model-choice" disabled><option value="">先刷新模型列表</option></select></label>
          <button id="model-refresh" type="button" onclick="loadModelOptions()">刷新模型列表</button>
          <button id="model-apply" type="button" onclick="applyModelMode()">应用</button>
        </div>
        <div class="model-mode-note" id="model-note" role="status" aria-live="polite">自动：沿用现有故障切换。手动：固定主模型，限流只报错，不自动换线路。</div>
      </div>

      <div id="stack-status">
        <div class="sect" style="margin-bottom:9px">装配状态</div>
        <div class="grid" id="services"></div>
      </div>

      <div id="activity-tabs">
        <div class="tabs">
          <button class="on" data-tab="act">最近活动</button>
          <button data-tab="log">运行日志</button>
          <button data-tab="games">游戏</button>
          <span class="grow"></span>
          <span class="when" id="stamp"></span>
        </div>
      </div>
      <div class="stream" id="act"><div class="empty">正在读取 …</div></div>
      <div class="stream" id="log" style="display:none"><div class="empty">—</div></div>
      <section id="games" class="game-panel" style="display:none" aria-label="游戏与手机观看">
        <div class="game-heading"><div><h2>Minecraft</h2><p>先开启服务器，再选择观察或一起玩。</p></div><button id="game-settings" class="game-link" type="button">配置与更多操作</button></div>
        <div id="game-rows"></div>
        <div class="game-view-heading"><h3>手机观看</h3><span>同一 Wi-Fi · 默认静音</span></div>
        <div id="viewer-row"></div>
        <p id="game-notice" role="status" aria-live="polite">正在读取游戏状态…</p>
      </section>

      <div class="hint" id="hint">「⤓」收进托盘并保持服务运行；「✕」退出启动器并停止 SnowLuma、OneBot WS、Cortico 和免费池守护。</div>
    </main>
  </div>
</div>
<div class="resize-handle n" data-edge="n"></div>
<div class="resize-handle e" data-edge="e"></div>
<div class="resize-handle s" data-edge="s"></div>
<div class="resize-handle w" data-edge="w"></div>
<div class="resize-handle ne" data-edge="ne"></div>
<div class="resize-handle nw" data-edge="nw"></div>
<div class="resize-handle se" data-edge="se"></div>
<div class="resize-handle sw" data-edge="sw"></div>

<script src="games.js"></script>
<script>
const $ = id => document.getElementById(id);
const CIRC = 2 * Math.PI * 56;
const LV = { info: 'INFO', debug: 'DEBUG', warn: 'WARN', error: 'ERR' };
const DEFAULT_HINT = $('hint').textContent;
let poll = null, lastBusy = false;
const localActions = new Map();

function toast(msg) {
  const hint = $('hint');
  hint.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => {
    hint.textContent = DEFAULT_HINT;
  }, 4200);
}

function esc(s) { return String(s == null ? '' : s); }

function setRing(up, total) {
  const frac = total ? up / total : 0;
  const arc = $('arc');
  arc.setAttribute('stroke-dasharray', CIRC.toFixed(1));
  arc.setAttribute('stroke-dashoffset', (CIRC * (1 - frac)).toFixed(1));
  const col = up === total ? '#34D399' : (up >= total - 2 ? '#FBBF24' : '#F8717A');
  arc.style.stroke = col;
  $('cnt').innerHTML = up + '<small>/' + total + '</small>';
}

function renderServices(list) {
  const box = $('services');
  list.forEach(s => {
    let el = box.querySelector(`[data-service-id="${s.id}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'svc';
      el.dataset.serviceId = s.id;
      const dot = document.createElement('div'); dot.className = 'dot';
      const text = document.createElement('div'); text.className = 'txt';
      const name = document.createElement('b');
      const detail = document.createElement('i');
      text.append(name, detail);
      const status = document.createElement('div'); status.className = 'st';
      el.append(dot, text, status);
      if (['snow', 'onebot', 'cortico', 'guard'].includes(s.id)) {
        const control = document.createElement('button');
        control.type = 'button';
        control.className = 'service-action';
        el.appendChild(control);
      }
      box.appendChild(el);
    }
    const action = s.action || localActions.get(s.id) || '';
    el.className = 'svc' + (s.up ? ' up' : '') + (s.paused ? ' paused' : '') + (action ? ' pending' : '');
    el.querySelector('.txt b').textContent = s.name;
    el.querySelector('.txt i').textContent = s.detail;
    const st = el.querySelector('.st');
    st.textContent = action === 'stopping' ? '停止中' : action === 'starting' ? '启动中' : s.paused ? '已暂停' : s.up === null ? '未探测' : s.up ? '在线' : '离线';
    const control = el.querySelector('.service-action');
    if (control) {
      control.className = 'service-action ' + (action ? 'pending' : s.up ? 'stop' : 'start');
      control.textContent = action === 'stopping' ? '停止中…' : action === 'starting' ? '启动中…' : s.paused ? '手动模式' : s.up ? '停止' : '启动';
      control.disabled = !!action || !!s.paused;
      control.title = s.id === 'onebot'
        ? 'OneBot WS 由 SnowLuma 承载，操作时会联动 SnowLuma'
        : s.id === 'snow' ? 'SnowLuma 承载 OneBot WS，操作时会联动 OneBot WS' : '';
      control.onclick = async event => {
        event.stopPropagation();
        const method = s.up ? 'stop_service' : 'start_service';
        const verb = s.up ? 'stopping' : 'starting';
        const linkedIds = ['snow', 'onebot'].includes(s.id) ? ['snow', 'onebot'] : [s.id];
        const startedAt = performance.now();
        linkedIds.forEach(id => localActions.set(id, verb));
        control.disabled = true;
        control.className = 'service-action pending';
        el.classList.add('pending');
        control.textContent = s.up ? '停止中…' : '启动中…';
        st.textContent = s.up ? '停止中' : '启动中';
        try {
          const result = await window.pywebview.api[method](s.id);
          toast(result.msg || (result.ok ? '操作完成。' : '操作失败。'));
        } catch (e) { toast('操作失败：' + esc(e && e.message ? e.message : e)); }
        await new Promise(resolve => setTimeout(resolve, Math.max(0, 260 - (performance.now() - startedAt))));
        linkedIds.forEach(id => localActions.delete(id));
        await refresh();
      };
    }
  });
}

function renderProvider(p) {
  if(p.routing?.error)$('model-note').textContent=p.routing.error;
  if(!modelDraft&&!modelBusy)$('model-mode').value=p.routing?.mode||'auto';
  if(!modelDraft&&!modelBusy&&p.routing?.provider&&Array.from($('model-choice').options).some(o=>o.value===p.routing.provider))$('model-choice').value=p.routing.provider;
  updateModelControls();
  $('p-active').textContent = p.active || '未知（守护未运行或控制台未响应）';
  const chips = [];
  if (p.active && p.primary && p.active === p.primary) chips.push(['主用 · 免费池', 'ok']);
  else if (p.active && p.fallback && p.active === p.fallback) chips.push(['已切备用 · 渠道网关', 'warn']);
  chips.push([(p.switches || 0) + '/' + (p.maxSwitches || 12) + ' 今日切换', '']);
  chips.push([p.routing?.mode==='manual'?'手动固定 · 不自动换线':'自动切换','']);
  const box = $('p-chips');
  box.innerHTML = '';
  chips.forEach(([txt, cls]) => {
    const c = document.createElement('span');
    c.className = 'chip ' + cls;
    c.textContent = txt;
    box.appendChild(c);
  });
}

let modelBusy=false,modelDraft=false;
function updateModelControls(){
  $('model-mode').disabled=modelBusy;
  $('model-choice').disabled=modelBusy||$('model-mode').value!=='manual';
  $('model-refresh').disabled=modelBusy;
  $('model-apply').disabled=modelBusy||($('model-mode').value==='manual'&&!$('model-choice').value);
}
$('model-mode').addEventListener('change',()=>{modelDraft=true;updateModelControls();if($('model-mode').value==='manual'&&!$('model-choice').value)void loadModelOptions();});
$('model-choice').addEventListener('change',()=>{modelDraft=true;updateModelControls();});
async function loadModelOptions(){
  if(modelBusy)return;modelBusy=true;updateModelControls();$('model-note').textContent='读取已配置模型端点…';
  try{
    const result=await window.pywebview.api.get_model_options();if(!result.ok)throw Error(result.msg||'读取失败');
    const selected=$('model-choice').value||result.routing?.provider||result.active;
    $('model-choice').replaceChildren();
    for(const p of result.providers){const option=document.createElement('option');option.value=p.id;option.textContent=p.name+' · '+p.model;$('model-choice').append(option);}
    if(result.providers.some(p=>p.id===selected))$('model-choice').value=selected;
    $('model-note').textContent=result.providers.length?'列表来自 Cortico 已配置端点；读取列表不调用模型。':'没有已配置的模型，请先在 Cortico 控制台添加端点。';
  }catch(e){$('model-note').textContent=e.message||String(e);}
  finally{modelBusy=false;updateModelControls();}
}
async function applyModelMode(){
  if(modelBusy)return;modelBusy=true;updateModelControls();$('model-note').textContent='正在应用切换方式…';
  try{
    const result=await window.pywebview.api.set_model_mode($('model-mode').value,$('model-choice').value);
    $('model-note').textContent=result.msg||'操作已结束';if(result.ok)modelDraft=false;
  }catch(e){$('model-note').textContent=e.message||String(e);}
  finally{modelBusy=false;updateModelControls();await refresh();}
}

function renderActivity(items, run) {
  const box = $('act');
  box.innerHTML = '';
  if (!items || !items.length) {
    box.innerHTML = '<div class="empty">暂时没有可显示的活动。发起一轮对话后这里会出现。</div>';
    return;
  }
  [...items].reverse().forEach(a => {
    const row = document.createElement('div');
    row.className = 'row ' + (a.level === 'warn' ? 'warn' : a.level === 'error' ? 'error' : '');
    const t = document.createElement('span'); t.className = 't'; t.textContent = a.ts;
    const lv = document.createElement('span'); lv.className = 'lv'; lv.textContent = LV[a.level] || a.level;
    const m = document.createElement('span'); m.className = 'm'; m.textContent = a.area + ' · ' + a.msg;
    row.append(t, lv, m);
    box.appendChild(row);
  });
}

function renderLog(lines) {
  const box = $('log');
  box.innerHTML = '';
  if (!lines || !lines.length) {
    box.innerHTML = '<div class="empty">—</div>';
    return;
  }
  [...lines].reverse().forEach(l => {
    const row = document.createElement('div');
    row.className = 'row';
    const m = document.createElement('span'); m.className = 'm'; m.textContent = l;
    row.appendChild(m);
    box.appendChild(row);
  });
}

async function refresh() {
  try {
    const s = await window.pywebview.api.get_status();
    setRing(s.services.filter(x => x.up&&!x.paused).length, s.services.filter(x=>!x.paused).length);
    const up = s.services.filter(x => x.up||x.paused).length;
    const total = s.services.length;
    const v = $('verdict');
    if (s.allUp) {
      v.innerHTML = '全部就绪<sub>可以聊了</sub>';
    } else if (s.core) {
      v.innerHTML = '核心在线<sub>有 ' + (total - up) + ' 项未就绪</sub>';
    } else {
      v.innerHTML = '未就绪<sub>点「启动全部」拉起</sub>';
    }
    renderServices(s.services);
    renderProvider(s.provider);
    renderActivity(s.activity, s.run);
    renderLog(s.log);
    const r = s.run;
    $('meta-run').innerHTML = r
      ? '最新一轮 ' + esc(r.startedAt) + '<br>' + esc(r.id) + ' · ' + esc(r.worlds) + ' 个 World'
      : '暂无运行记录';
    $('meta-base').textContent = s.base;
    $('stamp').textContent = s.ts + ' · 启动 ' + s.uptime;

    const btn = $('b-start');
    btn.disabled = !!s.busy;
    btn.textContent = s.busy ? '启动中 …' : '启动全部';
    lastBusy = !!s.busy;
  } catch (e) {
    $('verdict').innerHTML = '界面通信失败<sub>' + esc(e && e.message ? e.message : e) + '</sub>';
  }
}

function tabTo(name) {
  document.querySelector('main').classList.toggle('games-view',name === 'games');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('act').style.display = name === 'act' ? '' : 'none';
  $('log').style.display = name === 'log' ? '' : 'none';
  $('games').style.display = name === 'games' ? '' : 'none';
  if(name === 'games') window.GamePanel?.refresh();
}

function bindResizeHandles() {
  document.querySelectorAll('.resize-handle').forEach(handle => {
    handle.addEventListener('pointerdown', async event => {
      if (event.button !== 0) return;
      event.preventDefault();
      document.body.classList.remove('resize-settled');
      document.body.classList.add('window-resizing');
      const edge = handle.dataset.edge;
      const start = { x: event.screenX, y: event.screenY, width: innerWidth, height: innerHeight };
      let latest = event, inFlight = false, needsUpdate = false, timer = null;
      const calculate = e => {
        const dx = e.screenX - start.x, dy = e.screenY - start.y;
        const west = edge.includes('w'), east = edge.includes('e');
        const north = edge.includes('n'), south = edge.includes('s');
        const width = Math.max(860, start.width + (east ? dx : west ? -dx : 0));
        const height = Math.max(600, start.height + (south ? dy : north ? -dy : 0));
        return { width, height };
      };
      const flush = async () => {
        if (inFlight || !needsUpdate) return;
        inFlight = true;
        try {
          needsUpdate = false;
          const { width, height } = calculate(latest);
          await window.pywebview.api.resize_window(width, height, edge);
        } finally {
          inFlight = false;
          if (needsUpdate && !timer) timer = setTimeout(() => { timer = null; flush(); }, 16);
        }
      };
      const move = e => {
        latest = e;
        needsUpdate = true;
        if (!timer && !inFlight) timer = setTimeout(() => { timer = null; flush(); }, 16);
      };
      const end = e => {
        latest = e;
        needsUpdate = true;
        clearTimeout(timer);
        timer = null;
        flush();
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', end);
        handle.removeEventListener('pointercancel', end);
        try { handle.releasePointerCapture(event.pointerId); } catch (_) {}
        document.body.classList.remove('window-resizing');
        document.body.classList.add('resize-settled');
        setTimeout(() => document.body.classList.remove('resize-settled'), 200);
      };
      handle.setPointerCapture(event.pointerId);
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
    });
  });
}

async function boot() {
  try {
    const info = await window.pywebview.api.get_status();
    $('ver').textContent = 'v' + info.version;
    if (info.appName) { $('appname').textContent = info.appName; document.title = info.appName; }
  } catch (e) { /* ignore */ }

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => tabTo(b.dataset.tab));
  bindResizeHandles();
  window.GamePanel?.init();
  $('b-start').onclick = async () => {
    $('b-start').disabled = true;
    $('b-start').textContent = '启动中 …';
    toast('正在按顺序拉起各组件 …');
    await window.pywebview.api.start_all();
    setTimeout(refresh, 1500);
  };
  $('b-refresh').onclick = () => { toast('已刷新。'); refresh(); };
  $('b-min').onclick = () => {
    document.body.classList.remove('window-restoring');
    document.body.classList.add('window-minimizing');
    setTimeout(() => {
      document.body.classList.remove('window-minimizing');
      window.pywebview.api.minimize_window();
    }, 180);
  };
  $('b-hide').onclick = () => { toast('已收进托盘。'); window.pywebview.api.hide_window(); };
  $('b-quit').onclick = () => window.pywebview.api.quit_app();
  $('b-exit').onclick = () => window.pywebview.api.quit_app();
  $('b-console').onclick = () => window.pywebview.api.open_console();
  $('b-snow').onclick = () => window.pywebview.api.open_snowluma();

  await refresh();
  poll = setInterval(refresh, 2000);
}

window.addEventListener('pywebviewready', boot);
</script>
