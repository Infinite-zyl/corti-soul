plugins { id 'fabric-loom' version '1.7.4' }
version = '1.1.0'
group = 'local.cortisoul'
base { archivesName = 'corti-observer' }
repositories { mavenCentral() }
loom { clientOnlyMinecraftJar() }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.6'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.3.5'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
jar { from('LICENSE'); from('NOTICE.md') }
