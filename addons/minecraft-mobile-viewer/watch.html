<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>corti · 手机观看</title>
<style>
:root{font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#eef2f8;background:#0b0e14}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 20px}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px}h1{font-size:24px;letter-spacing:-.02em;margin:0 0 24px}header span{color:#b975f9;font-size:13px}.screen{background:#030507;border:1px solid #303541;border-radius:14px;overflow:hidden}video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}#status{min-height:48px;color:#b4becd;font-size:14px;line-height:1.7;margin:18px 0}button{min-height:48px;border-radius:10px;background:#a855f7;border:0;color:white;padding:12px 22px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #eef2f8;outline-offset:3px}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:12px;flex-wrap:wrap}.secondary{background:#242a35}footer{font-size:12px;color:#9aa5b5;margin-top:24px;line-height:1.8}@media(max-width:480px){main{padding:22px 14px}h1{font-size:21px}header span{font-size:12px}}
</style><main><header><h1>corti 的一天</h1><span>局域网 · 仅观看</span></header><div class="screen"><video id="video" autoplay playsinline muted controls></video></div><p id="status" role="status" aria-live="polite">正在检查观察者画面…</p><div class="actions"><button id="connect">开始观看</button><button id="fullscreen" class="secondary">全屏</button></div><footer>画面来自电脑上的观察者客户端。第一版不传输声音。<br>关闭此页不会停止 corti；若窗口最小化或电脑休眠，画面可能暂停。</footer></main>
<script>
const video=document.querySelector('#video'),status=document.querySelector('#status'),button=document.querySelector('#connect');
let pc=null,session=null,busy=false,retry=null,desired=false,viewerStopped=false;
async function disconnect(){clearTimeout(retry);if(pc){pc.close();pc=null}if(session){fetch(session,{method:'DELETE',keepalive:true}).catch(()=>{});session=null}}
async function connect(){if(busy||viewerStopped)return;busy=true;button.disabled=true;desired=true;await disconnect();try{const state=await fetch('/status').then(r=>{if(!r.ok)throw Error('观看登录已失效，请刷新页面。');return r.json()});if(!state.ready)throw Error(state.message);status.textContent='正在连接画面…';pc=new RTCPeerConnection({iceServers:[]});const current=pc;pc.addTransceiver('video',{direction:'recvonly'});pc.ontrack=e=>{video.srcObject=new MediaStream([e.track]);video.play().catch(()=>{});status.textContent='正在观看观察者画面';button.textContent='重新连接'};pc.onconnectionstatechange=()=>{if(current!==pc)return;if(['failed','disconnected','closed'].includes(pc.connectionState)){status.textContent='视频连接断开，正在等待恢复…';if(desired){clearTimeout(retry);retry=setTimeout(connect,5000)}}};await pc.setLocalDescription(await pc.createOffer());if(pc.iceGatheringState!=='complete')await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('建立视频连接超时，请重新连接。')),10000);pc.addEventListener('icegatheringstatechange',()=>{if(current.iceGatheringState==='complete'){clearTimeout(timer);resolve()}})});if(current!==pc)return;const res=await fetch('/corti/whep',{method:'POST',headers:{'Content-Type':'application/sdp'},body:pc.localDescription.sdp});if(!res.ok)throw Error('观察者视频暂时不可用，稍后自动重试。');session=res.headers.get('Location');await pc.setRemoteDescription({type:'answer',sdp:await res.text()});}catch(e){if(viewerStopped)return;status.textContent=e.message;await disconnect();if(desired)retry=setTimeout(connect,5000)}finally{busy=false;button.disabled=viewerStopped}}
button.onclick=connect;document.querySelector('#fullscreen').onclick=()=>{if(video.requestFullscreen)video.requestFullscreen().catch(()=>{});else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen()};window.addEventListener('pagehide',()=>{desired=false;disconnect()});fetch('/status').then(r=>r.json()).then(s=>{status.textContent=s.message}).catch(()=>{status.textContent='无法连接观看服务，请确认手机与电脑在同一 Wi-Fi。'});
</script><script src="/watch-controls.js"></script></html>
