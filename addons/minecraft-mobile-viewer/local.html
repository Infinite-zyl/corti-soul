<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>corti · 手机观看入口</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#eef2f8;font:15px/1.8 "Microsoft YaHei UI",system-ui,sans-serif}main{max-width:760px;margin:48px auto;padding:0 24px}h1{font-size:29px;letter-spacing:-.02em;margin:0 0 10px}.muted{color:#b4becd}.entry{display:flex;gap:28px;align-items:center;margin:30px 0;padding:24px;border:1px solid #303541;border-radius:14px}.qr{width:180px;height:180px;flex:none;background:white;padding:10px;border-radius:8px}a{color:#c7a1ff;overflow-wrap:anywhere}strong{font-weight:600}code{font-size:17px;color:#eef2f8;user-select:all}#status{padding:16px 0;border-top:1px solid #303541;color:#b4becd}ol{padding-left:22px;color:#b4becd}li{padding:5px 0}footer{color:#9aa5b5;font-size:12px;margin:30px 0}@media(max-width:600px){main{margin:28px auto}.entry{flex-direction:column;align-items:flex-start;padding:20px}h1{font-size:25px}}</style><main><h1>用手机看看 corti</h1><p class="muted">手机和电脑连接同一个 Wi-Fi，然后扫描二维码。</p><div class="entry"><img class="qr" src="/qr.svg" alt="手机观看地址二维码" width="180" height="180"><div><strong>观看地址</strong><br><a href="{{URL}}" target="_blank" rel="noreferrer">{{URL}}</a><p>账号 <code>viewer</code><br>密码 <code>{{PASSWORD}}</code></p></div></div><p id="status" role="status" aria-live="polite">正在读取观看状态…</p><ol><li>在 MC World 启动“观察者客户端”，保持窗口非最小化。</li><li>手机扫码，输入上面的账号和密码，点“开始观看”。</li><li>不用时双击“关闭手机观看”。corti 与游戏服务器会继续运行。</li></ol><footer>本页只在电脑本机显示密码。手机入口仅用于观看，不开放 Cortico 控制台。<br>电脑休眠、切换网络或最小化观察者窗口后，可能需要重新连接。此入口不提供外出观看。</footer></main><script>async function refresh(){try{const r=await fetch('/status');const s=await r.json();document.querySelector('#status').textContent=s.message}catch{document.querySelector('#status').textContent='观看服务已停止。需要时重新双击“开启手机观看”。'}}refresh();setInterval(refresh,4000)</script></html>
